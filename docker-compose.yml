version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/forms.db:/app/forms.db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./forms.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-at-least-32chars!}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - UPLOAD_DIR=./uploads
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
